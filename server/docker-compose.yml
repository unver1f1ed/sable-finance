services:
  postgres:
    image: postgres:16
    container_name: sable-postgres
    environment:
      POSTGRES_USER: sable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    ports:
      - "5432:5432"
    volumes:
      - sable-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sable"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional: the API in a container. Start with `docker compose --profile api up -d --build`.
  # Secrets (Jwt:Key, Seed:*) are read from the same dotnet user-secrets as `dotnet run`;
  # only the connection strings are overridden because the database host is `postgres` here.
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: src/Sable.Api/Dockerfile
    container_name: sable-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Identity: Host=postgres;Port=5432;Username=sable;Password=${POSTGRES_PASSWORD};Database=sable_identity
      ConnectionStrings__Finance: Host=postgres;Port=5432;Username=sable;Password=${POSTGRES_PASSWORD};Database=sable_finance
    volumes:
      # Windows path of dotnet user-secrets; on Linux or macOS use ~/.microsoft/usersecrets instead.
      - ${APPDATA:?Run from Windows or adjust the user-secrets path}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
    ports:
      - "5081:8080"

volumes:
  sable-pgdata:
