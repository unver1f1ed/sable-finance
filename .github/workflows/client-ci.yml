name: Client CI

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
