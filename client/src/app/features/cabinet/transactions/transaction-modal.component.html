<sb-modal [open]="isOpen()" [title]="title()" [width]="560" [locked]="sending() || confirmOpen()" (closed)="close()">
  @if (!store.hasAccounts()) {
    <p class="text-body text-muted">Спершу додайте рахунок у розділі «Огляд», і тоді зможете записувати доходи та витрати.</p>
  } @else {
    <form id="transaction-form" class="form-stack" novalidate [formGroup]="form" (ngSubmit)="submit()">
      <sb-segmented [options]="typeOptions" formControlName="type" block onSurface ariaLabel="Тип транзакції" />

      <sb-amount-field label="Сума" variant="hero" formControlName="amount" [error]="error('amount')" />

      <sb-field label="Опис" onSurface [error]="error('description')">
        <input type="text" autocomplete="off" placeholder="Наприклад, Сільпо" formControlName="description" />
      </sb-field>

      <div class="form-stack__pair">
        <sb-select label="Категорія" onSurface formControlName="categoryId" placeholder="Оберіть категорію" [options]="categoryOptions()" [error]="error('categoryId')" />
        <sb-select label="Рахунок" onSurface formControlName="accountId" placeholder="Оберіть рахунок" [options]="accountOptions()" [error]="error('accountId')" />
      </div>

      <div class="form-stack__pair">
        <sb-field label="Дата" onSurface [error]="error('occurredOn')">
          <input type="date" formControlName="occurredOn" [min]="minDate" [max]="maxDate" />
        </sb-field>
        @if (showGoal()) {
          <sb-select label="Ціль (необов’язково)" onSurface formControlName="goalId" placeholder="Не прив’язано" [options]="goalOptions()" />
        }
      </div>

      <div class="form-stack__note">
        <sb-field label="Нотатка" onSurface [error]="error('note')">
          <textarea rows="3" placeholder="Додайте коментар" formControlName="note"></textarea>
        </sb-field>
        <p class="counter num" [class.counter--over]="noteLength() > 300">{{ noteLength() }} / 300 символів</p>
      </div>
    </form>
  }
  @if (!store.hasAccounts()) {
    <button modalFooter sbButton type="button" (click)="close()">Зрозуміло</button>
  }
  @if (store.hasAccounts()) {
    <div modalFooter class="form-stack__actions form-stack__actions--split form-stack__footer">
      @if (editing()) {
        <button sbButton variant="danger" type="button" [disabled]="sending()" (click)="confirmOpen.set(true)">
          <sb-icon name="trash" [size]="16" />
          Видалити
        </button>
      }
      <span class="form-stack__spacer"></span>
      <button sbButton variant="ghost" type="button" [disabled]="sending()" (click)="close()">Скасувати</button>
      <button sbButton type="submit" form="transaction-form" [disabled]="sending()">
        {{ sending() ? 'Зберігаємо…' : editing() ? 'Зберегти зміни' : 'Додати транзакцію' }}
      </button>
    </div>
  }
</sb-modal>

<sb-confirm-dialog
  [open]="confirmOpen()"
  title="Видалити транзакцію?"
  [message]="deleteMessage()"
  confirmLabel="Видалити"
  danger
  [busy]="sending()"
  (confirm)="remove()"
  (cancel)="confirmOpen.set(false)"
/>
