<sb-modal [open]="open()" title="Зміна пароля" [width]="480" [locked]="sending()" (closed)="closed.emit()">
  <form id="password-form" class="form-stack" novalidate [formGroup]="form" (ngSubmit)="submit()">
    <sb-field label="Поточний пароль" onSurface [error]="error('currentPassword')">
      <sb-icon fieldLeading name="lock" [size]="18" />
      <input type="password" autocomplete="current-password" formControlName="currentPassword" />
    </sb-field>

    <sb-field label="Новий пароль" onSurface [error]="error('newPassword')" [hint]="passwordHint">
      <sb-icon fieldLeading name="lock" [size]="18" />
      <input type="password" autocomplete="new-password" formControlName="newPassword" />
    </sb-field>

    <sb-field label="Повторіть новий пароль" onSurface [error]="error('repeatPassword')">
      <sb-icon fieldLeading name="lock" [size]="18" />
      <input type="password" autocomplete="new-password" formControlName="repeatPassword" />
    </sb-field>
  </form>

  <div modalFooter class="form-stack__actions form-stack__footer">
    <button sbButton variant="ghost" type="button" [disabled]="sending()" (click)="closed.emit()">Скасувати</button>
    <button sbButton type="submit" form="password-form" [disabled]="sending()">{{ sending() ? 'Зберігаємо…' : 'Змінити пароль' }}</button>
  </div>
</sb-modal>
