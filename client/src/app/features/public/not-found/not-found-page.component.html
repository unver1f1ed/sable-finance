<section class="container not-found">
  <div class="not-found__visual" aria-hidden="true">
    <span class="not-found__code">404</span>
    <sb-sable-card class="not-found__card" variant="dark" label="Загубилась" [width]="240" />
  </div>
  <p class="text-eyebrow">Помилка 404</p>
  <h1 class="not-found__title text-h2"><b>Такої сторінки немає.</b> Можливо, посилання застаріло або в адресі помилка.</h1>
  <div class="not-found__actions">
    <a sbButton size="lg" routerLink="/">На головну</a>
    <a sbButton variant="ghost" size="lg" routerLink="/help">До довідки</a>
  </div>
</section>
