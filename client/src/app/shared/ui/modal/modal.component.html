@if (open()) {
  <div class="modal__overlay" (mousedown)="onBackdropPress($event)">
    <div
      #dialog
      class="modal"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="titleId"
      [style.--modal-width]="width() + 'px'"
      (keydown)="onKeydown($event)"
    >
      <div class="modal__handle" aria-hidden="true"></div>
      <div class="modal__header" (mousedown)="keepFocus($event)">
        <h2 class="modal__title text-h4" [id]="titleId">{{ title() }}</h2>
        <button sbIconButton size="sm" type="button" aria-label="Закрити" [disabled]="locked()" (click)="close()">
          <sb-icon name="x" [size]="16" />
        </button>
      </div>
      <div class="modal__body"><ng-content /></div>
      <div class="modal__footer" (mousedown)="keepFocus($event)"><ng-content select="[modalFooter]" /></div>
    </div>
  </div>
}
