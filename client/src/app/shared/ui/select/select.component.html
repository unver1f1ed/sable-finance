<sb-field
  [label]="label()"
  [hint]="hint()"
  [error]="error()"
  [onSurface]="onSurface()"
  [hideLabel]="hideLabel()"
  [variant]="variant()"
>
  <select [disabled]="disabled()" (change)="change($event)" (blur)="touch()">
    @if (placeholder() !== undefined) {
      <option value="" [selected]="value() === ''">{{ placeholder() }}</option>
    }
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
    }
  </select>
  <sb-icon fieldTrailing name="chev-down" [size]="16" />
</sb-field>
