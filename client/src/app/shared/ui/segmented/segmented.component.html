<div
  class="segmented"
  [class.segmented--block]="block()"
  [class.segmented--on-surface]="onSurface()"
  role="radiogroup"
  [attr.aria-label]="ariaLabel()"
>
  @for (option of options(); track option.value; let i = $index) {
    <button
      #optionButton
      class="segmented__option"
      [class.segmented__option--active]="option.value === value()"
      type="button"
      role="radio"
      [attr.aria-checked]="option.value === value()"
      [attr.tabindex]="isTabStop(i) ? 0 : -1"
      [disabled]="disabled()"
      (click)="select(option)"
      (keydown)="onKeydown($event, i)"
    >
      {{ option.label }}
    </button>
  }
</div>
