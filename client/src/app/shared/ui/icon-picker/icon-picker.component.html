<fieldset class="picker" [disabled]="disabled()">
  <legend class="picker__legend">{{ label() }}</legend>
  <div class="picker__options">
    @for (option of options; track option.value) {
      <label class="picker__option">
        <input
          class="picker__input visually-hidden"
          type="radio"
          [name]="name"
          [value]="option.value"
          [checked]="value() === option.value"
          [attr.aria-label]="option.label"
          (change)="select(option.value)"
        />
        <span class="picker__icon" [attr.title]="option.label">
          <sb-icon [name]="option.value" [size]="20" />
        </span>
      </label>
    }
  </div>
</fieldset>
